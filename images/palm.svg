<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients for background and water -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEEAD" />
      <stop offset="100%" stop-color="#FBB034" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>

  <!-- Background: Sunset sky -->
  <rect width="800" height="400" fill="url(#bgGradient)" />

  <!-- Horizon: Water area at the bottom -->
  <rect y="250" width="800" height="150" fill="url(#waterGradient)" />

  <!-- Abstract Open Book: Two mirrored curves in the center -->
  <g transform="translate(350, 170)">
    <path d="M50,30 C30,10 30,50 50,40 C70,30 70,70 50,60 Z" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
    <path d="M50,30 C70,10 70,50 50,40 C30,30 30,70 50,60 Z" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
  </g>

  <!-- Palm Tree: Trunk and leaves -->
  <g transform="translate(100, 0)">
    <!-- Trunk -->
    <path d="M150,250 L160,180 Q155,170 165,160 L170,120" 
          stroke="#654321" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M170,120 Q210,100 250,120" 
          stroke="#228B22" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M170,120 Q130,100 90,120" 
          stroke="#228B22" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sun: Positioned to evoke a warm, inviting feel -->
  <circle cx="700" cy="100" r="50" fill="#FFD700" opacity="0.8"/>
</svg>
